<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Likes - TarabBladi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="browse-page">
    <!-- Navigation -->
    <nav class="navbar solid-nav">
        <div class="nav-container">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="8" width="2" height="8" fill="#e2b764" />
                    <rect x="6" y="4" width="2" height="16" fill="#e2b764" />
                    <rect x="10" y="10" width="2" height="4" fill="#e2b764" />
                    <rect x="14" y="2" width="2" height="20" fill="#e2b764" />
                    <rect x="18" y="6" width="2" height="12" fill="#e2b764" />
                </svg>
                <div class="logo-text">
                    <span class="brand-name">TARABBLADI</span>
                    <span class="brand-sub">ARABIC DJ RECORD POOL</span>
                </div>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="browse.html">BROWSE</a></li>
                <li><a href="charts.html">CHARTS</a></li>
                <li><a href="blog.html">BLOG</a></li>
                <li><a href="about.html">ABOUT US</a></li>
            </ul>

            <div class="nav-actions">
                <!-- Nav actions will be populated by auth.js -->
            </div>
        </div>
    </nav>

    <div class="browse-wrapper">
        <!-- Back Button -->
        <div style="max-width: 1000px; margin: 20px auto 0; width: 100%;">
            <a href="profile.html" style="display: inline-flex; align-items: center; gap: 8px; color: #888; text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: color 0.2s;" onmouseover="this.style.color='#e2b764'" onmouseout="this.style.color='#888'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back
            </a>
        </div>
        
        <!-- Page Header -->
        <header class="browse-header" style="text-align: center; margin-bottom: 40px; margin-top: 20px;">
            <h1>MY LIKES</h1>
            <p>Tracks you have liked and saved for later.</p>
        </header>

        <div class="browse-layout" style="justify-content: center;">
            <!-- Main Content -->
            <main class="browse-main" style="flex: 0 0 100%; max-width: 1000px;">
                <!-- Track Table -->
                <div class="track-table">
                    <div class="track-table-header">
                        <div class="th-track">TRACK</div>
                        <div class="th-genre">GENRE</div>
                        <div class="th-bpm">BPM</div>
                        <div class="th-key">KEY</div>
                        <div class="th-version">VERSION</div>
                        <div class="th-released">RELEASED</div>
                        <div class="th-waveform"></div>
                        <div class="th-actions"></div>
                    </div>

                    <div class="track-table-body" id="likes-track-list">
                        <div class="empty-state" style="text-align: center; padding: 50px; color: #888; width: 100%;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 15px; opacity: 0.5;">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <h2 style="font-size: 1.5rem; margin-bottom: 10px; color: #fff;">No liked tracks yet</h2>
                            <p>You haven't liked any songs yet. Go browse and find some great tracks!</p>
                            <div style="margin-top: 20px;">
                                <a href="browse.html" class="btn-primary">Browse Music</a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="auth.js"></script>
    <script type="module">
        import { supabase } from './auth.js';

        let currentAudio = null;
        let currentPlayBtn = null;

        window.playAudio = function(audioId, btnElement) {
            const audio = document.getElementById(audioId);
            
            if (currentAudio && currentAudio !== audio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if(currentPlayBtn) {
                    currentPlayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
                }
            }

            if (audio.paused) {
                audio.play();
                btnElement.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
                currentAudio = audio;
                currentPlayBtn = btnElement;
                
                audio.onended = function() {
                    btnElement.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
                };
            } else {
                audio.pause();
                btnElement.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
            }
        };

        window.toggleLike = async function(trackId, btnElement) {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert("Please log in to like this track.");
                return;
            }
            const user = session.user;

            btnElement.disabled = true;
            const { data: existingLike } = await supabase
                .from('track_likes')
                .select('*')
                .eq('user_id', user.id)
                .eq('track_id', trackId)
                .single();

            if (existingLike) {
                await supabase.from('track_likes').delete().eq('id', existingLike.id);
                btnElement.style.color = '#fff';
                btnElement.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>';
                // Remove the row instantly on unlike in the Likes page
                const row = btnElement.closest('.track-row');
                if (row) {
                    row.remove();
                    const tbody = document.getElementById('likes-track-list');
                    if(tbody.children.length === 0) {
                        tbody.innerHTML = `
                        <div class="empty-state" style="text-align: center; padding: 50px; color: #888; width: 100%;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 15px; opacity: 0.5;">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <h2 style="font-size: 1.5rem; margin-bottom: 10px; color: #fff;">No liked tracks yet</h2>
                            <p>You haven't liked any songs yet. Go browse and find some great tracks!</p>
                            <div style="margin-top: 20px;">
                                <a href="browse.html" class="btn-primary">Browse Music</a>
                            </div>
                        </div>`;
                    }
                }
            } else {
                await supabase.from('track_likes').insert({ user_id: user.id, track_id: trackId });
                btnElement.style.color = '#e74c3c';
                btnElement.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#e74c3c" stroke="#e74c3c" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>';
            }
            btnElement.disabled = false;
        };

        window.openCommentPrompt = async function(trackId) {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert("Please log in to comment.");
                return;
            }
            const user = session.user;

            const content = prompt("Leave a comment on this track:");
            if (!content || !content.trim()) return;

            const { error } = await supabase.from('track_comments').insert({
                user_id: user.id,
                track_id: trackId,
                content: content.trim()
            });

            if (error) {
                alert("Error posting comment: " + error.message);
            } else {
                alert("Comment posted successfully!");
            }
        };

        async function loadLikedTracks() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    // Redirect to login if not authenticated
                    window.location.href = 'login.html';
                    return;
                }
                const user = session.user;

                document.getElementById('likes-track-list').innerHTML = `
                    <div class="empty-state" style="text-align: center; padding: 50px; color: #888; width: 100%;">
                        <h2 style="font-size: 1.5rem; margin-bottom: 10px; color: #fff;">Loading your likes...</h2>
                    </div>
                `;

                // Fetch likes for this user
                const { data: likes, error: likesError } = await supabase
                    .from('track_likes')
                    .select('track_id')
                    .eq('user_id', user.id);

                if (likesError) throw likesError;
                
                if (!likes || likes.length === 0) {
                    document.getElementById('likes-track-list').innerHTML = `
                        <div class="empty-state" style="text-align: center; padding: 50px; color: #888; width: 100%;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 15px; opacity: 0.5;">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <h2 style="font-size: 1.5rem; margin-bottom: 10px; color: #fff;">No liked tracks yet</h2>
                            <p>You haven't liked any songs yet. Go browse and find some great tracks!</p>
                            <div style="margin-top: 20px;">
                                <a href="browse.html" class="btn-primary">Browse Music</a>
                            </div>
                        </div>`;
                    return;
                }

                const trackIds = likes.map(l => l.track_id);
                
                // Fetch the actual tracks
                const { data: submissions, error: trackError } = await supabase
                    .from('track_submissions')
                    .select('*')
                    .in('id', trackIds);
                    
                if (trackError) throw trackError;

                const tbody = document.getElementById('likes-track-list');
                tbody.innerHTML = '';

                const userIds = submissions.map(s => s.user_id);
                const { data: profiles } = await supabase
                    .from('profiles')
                    .select('id, display_name')
                    .in('id', userIds);
                
                submissions.forEach(sub => {
                    const profile = profiles?.find(p => p.id === sub.user_id);
                    sub.profiles = profile ? { display_name: profile.display_name } : null;
                });

                submissions.forEach(sub => {
                    const row = document.createElement('div');
                    row.className = 'track-row';
                    
                    const audioId = 'audio_like_' + sub.id;
                    const artistName = sub.profiles ? sub.profiles.display_name : 'Unknown Artist';
                    const dateStr = new Date(sub.created_at).toLocaleDateString();
                    
                    // Since this is the likes page, they are all liked
                    const likeIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#e74c3c" stroke="#e74c3c" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>';
                    const likeColor = '#e74c3c';

                    row.innerHTML = `
                        <div class="td-track">
                            <div class="track-cover-play" style="flex-shrink: 0;">
                                <div style="width: 48px; height: 48px; background: #222; display: flex; align-items: center; justify-content: center; color: #e2b764;">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                                </div>
                                <button class="play-btn-small" onclick="playAudio('${audioId}', this)">
                                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                                </button>
                                <audio id="${audioId}" src="${sub.normal_track_url}"></audio>
                            </div>
                            <div class="track-info">
                                <h4>${sub.title}</h4>
                                <p>${artistName}</p>
                            </div>
                        </div>
                        <div class="td-genre"><span class="badge">${sub.genre}</span></div>
                        <div class="td-bpm">120</div>
                        <div class="td-key">Am</div>
                        <div class="td-version">Original</div>
                        <div class="td-released">${dateStr}</div>
                        <div class="td-waveform">
                            <div class="waveform-mockup" style="height: 30px;"></div>
                        </div>
                        <div class="td-actions">
                            <button class="icon-btn" onclick="toggleLike('${sub.id}', this)" style="color: ${likeColor};">${likeIcon}</button>
                            <button class="icon-btn" onclick="openCommentPrompt('${sub.id}')">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            </button>
                            ${sub.extended_track_url ? `<a href="${sub.extended_track_url}" target="_blank" class="icon-btn" title="Download Extended"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></a>` : `<a href="${sub.normal_track_url}" target="_blank" class="icon-btn" title="Download"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></a>`}
                        </div>
                    `;
                    tbody.appendChild(row);
                });

            } catch (err) {
                console.error("Error loading liked tracks:", err);
            }
        }

        loadLikedTracks();
    </script>
</body>
</html>
