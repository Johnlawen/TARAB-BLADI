<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track - TarabBladi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; }

        .track-page-hero {
            position: relative;
            background: linear-gradient(135deg, #111 0%, #1a1a2e 50%, #16213e 100%);
            padding: 100px 0 0;
            overflow: hidden;
        }
        .track-page-hero::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(226,183,100,0.08) 0%, transparent 70%);
        }

        .track-hero-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 0;
            display: flex;
            gap: 40px;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }

        .track-cover-large {
            width: 220px;
            height: 220px;
            flex-shrink: 0;
            border-radius: 12px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2b764;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .track-cover-large img { width: 100%; height: 100%; object-fit: cover; }

        .track-hero-info { flex: 1; padding-top: 10px; }
        .track-type-label { font-size: 0.75rem; letter-spacing: 2px; color: #e2b764; text-transform: uppercase; margin-bottom: 12px; }
        .track-hero-title { font-family: 'Outfit', sans-serif; font-size: 2.4rem; font-weight: 800; line-height: 1.2; margin-bottom: 12px; }
        .track-hero-artist { font-size: 1.1rem; color: #aaa; margin-bottom: 20px; }
        .track-hero-artist span { color: #e2b764; font-weight: 600; cursor: pointer; }
        .track-hero-artist span:hover { text-decoration: underline; }

        .track-hero-meta { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
        .track-meta-pill {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.8rem;
            color: #ccc;
        }
        .track-meta-pill strong { color: #e2b764; }

        /* Player */
        .track-player-bar {
            background: #111;
            border-top: 1px solid #1e1e1e;
            padding: 28px 24px;
            margin-top: 40px;
        }
        .track-player-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        .waveform-wrapper {
            position: relative;
            height: 80px;
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .waveform-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .waveform-progress {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 0%;
            background: rgba(226,183,100,0.15);
            pointer-events: none;
            transition: width 0.1s linear;
        }
        .waveform-cursor {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: #e2b764;
            left: 0%;
            pointer-events: none;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .play-pause-big {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: #e2b764;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #0a0a0a;
            flex-shrink: 0;
            transition: transform 0.2s, background 0.2s;
        }
        .play-pause-big:hover { transform: scale(1.08); background: #f0c97a; }

        .time-display { font-size: 0.85rem; color: #888; font-variant-numeric: tabular-nums; min-width: 90px; }
        .volume-control { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .volume-control input[type=range] {
            width: 80px; accent-color: #e2b764;
            cursor: pointer;
        }
        .volume-icon { color: #888; }

        /* Main content below player */
        .track-main-content {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px 60px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 40px;
        }

        .track-actions-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 36px;
        }
        .action-btn {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover { background: rgba(226,183,100,0.12); border-color: #e2b764; color: #e2b764; }
        .action-btn.liked { color: #e74c3c; border-color: #e74c3c; background: rgba(231,76,60,0.08); }
        .action-btn.download { background: #e2b764; color: #0a0a0a; border-color: #e2b764; font-weight: 600; }
        .action-btn.download:hover { background: #f0c97a; }

        /* Artist card */
        .artist-card {
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 16px;
            padding: 28px;
        }
        .artist-card-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .artist-avatar-md {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: #222;
            border: 2px solid #e2b764;
            object-fit: cover;
            display: flex; align-items: center; justify-content: center;
            color: #e2b764; font-size: 1.4rem; font-weight: 700; overflow: hidden;
        }
        .artist-avatar-md img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .artist-card-name { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
        .artist-card-sub { font-size: 0.8rem; color: #888; }
        .artist-card-bio { font-size: 0.85rem; color: #aaa; line-height: 1.6; border-top: 1px solid #1e1e1e; padding-top: 16px; }

        .track-info-section h3 { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: #666; margin-bottom: 14px; }
        .track-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }
        .info-item label { display: block; font-size: 0.75rem; color: #666; margin-bottom: 3px; }
        .info-item span { font-size: 0.9rem; color: #ddd; font-weight: 500; }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: #888; font-size: 0.85rem; text-decoration: none;
            margin: 24px 24px 0;
            transition: color 0.2s;
        }
        .back-link:hover { color: #e2b764; }

        @media (max-width: 768px) {
            .track-hero-container { flex-direction: column; }
            .track-cover-large { width: 160px; height: 160px; }
            .track-main-content { grid-template-columns: 1fr; }
            .track-hero-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar solid-nav">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="8" width="2" height="8" fill="#e2b764"/>
                    <rect x="6" y="4" width="2" height="16" fill="#e2b764"/>
                    <rect x="10" y="10" width="2" height="4" fill="#e2b764"/>
                    <rect x="14" y="2" width="2" height="20" fill="#e2b764"/>
                    <rect x="18" y="6" width="2" height="12" fill="#e2b764"/>
                </svg>
                <div class="logo-text">
                    <span class="brand-name">TARABBLADI</span>
                    <span class="brand-sub">ARABIC DJ RECORD POOL</span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="browse.html">BROWSE</a></li>
                <li><a href="charts.html">CHARTS</a></li>
                <li><a href="blog.html">BLOG</a></li>
                <li><a href="about.html">ABOUT US</a></li>
            </ul>
            <div class="nav-actions" id="nav-actions-placeholder"></div>
        </div>
    </nav>

    <a id="back-link" href="browse.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back
    </a>

    <!-- Hero Section -->
    <div class="track-page-hero">
        <div class="track-hero-container">
            <div class="track-cover-large" id="cover-art">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
            <div class="track-hero-info">
                <div class="track-type-label">Single · Original Track</div>
                <h1 class="track-hero-title" id="track-title">Loading...</h1>
                <p class="track-hero-artist">by <span id="artist-name">—</span></p>
                <div class="track-hero-meta">
                    <div class="track-meta-pill" id="meta-genre">Genre: —</div>
                    <div class="track-meta-pill" id="meta-date">Released: —</div>
                    <div class="track-meta-pill" id="meta-status">✓ Approved</div>
                </div>
            </div>
        </div>

        <!-- Player Bar -->
        <div class="track-player-bar">
            <div class="track-player-inner">
                <!-- Waveform -->
                <div class="waveform-wrapper" id="waveform-wrapper">
                    <canvas class="waveform-canvas" id="waveform-canvas"></canvas>
                    <div class="waveform-progress" id="waveform-progress"></div>
                    <div class="waveform-cursor" id="waveform-cursor"></div>
                </div>
                <!-- Controls -->
                <div class="player-controls">
                    <button class="play-pause-big" id="main-play-btn" onclick="togglePlay()">
                        <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <span class="time-display" id="time-display">0:00 / 0:00</span>
                    <div class="volume-control">
                        <svg class="volume-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
                    </div>
                </div>
                <audio id="main-audio" preload="metadata"></audio>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="track-main-content">
        <!-- Left: Actions + Info -->
        <div>
            <div class="track-actions-row">
                <button class="action-btn" id="like-btn" onclick="handleLike()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    Like
                </button>
                <a id="download-btn" href="#" class="action-btn download" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download
                </a>
                <a id="extended-btn" href="#" class="action-btn" target="_blank" style="display:none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Extended Mix
                </a>
            </div>

            <div class="track-info-section">
                <h3>Track Details</h3>
                <div class="track-info-grid">
                    <div class="info-item"><label>Genre</label><span id="info-genre">—</span></div>
                    <div class="info-item"><label>Version</label><span>Original Mix</span></div>
                    <div class="info-item"><label>Released</label><span id="info-date">—</span></div>
                    <div class="info-item"><label>Format</label><span>WAV / MP3</span></div>
                </div>
            </div>
        </div>

        <!-- Right: Artist Card -->
        <div>
            <div class="artist-card">
                <div class="artist-card-header">
                    <div class="artist-avatar-md" id="artist-avatar">?</div>
                    <div>
                        <div class="artist-card-name" id="artist-card-name">Artist</div>
                        <div class="artist-card-sub">TarabBladi Artist</div>
                    </div>
                </div>
                <div class="artist-card-bio" id="artist-bio">Loading artist info...</div>
            </div>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const supabase = createClient('https://ktrmgxixbycdapcmwcih.supabase.co', 'sb_publishable_H01ibabwtUj6FLR-zie7Xw_74dDAmsP');

        const params = new URLSearchParams(window.location.search);
        const trackId = params.get('id');
        const fromPage = params.get('from') || 'browse';

        // Set back link
        document.getElementById('back-link').href = fromPage === 'charts' ? 'charts.html' : 'browse.html';
        document.getElementById('back-link').querySelector('svg').nextSibling.textContent = ' Back to ' + (fromPage === 'charts' ? 'Charts' : 'Browse');

        if (!trackId) {
            document.querySelector('.track-hero-title').textContent = 'Track not found';
        } else {
            loadTrack();
        }

        let trackData = null;
        let currentUser = null;

        async function loadTrack() {
            const { data: { user } } = await supabase.auth.getUser();
            currentUser = user;

            const { data: sub, error } = await supabase
                .from('track_submissions')
                .select('*, profiles(display_name, bio, avatar_url)')
                .eq('id', trackId)
                .single();

            if (error || !sub) {
                document.getElementById('track-title').textContent = 'Track not found';
                return;
            }

            trackData = sub;
            const artistName = sub.profiles?.display_name || 'Unknown Artist';
            const dateStr = new Date(sub.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            // Hero info
            document.getElementById('track-title').textContent = sub.title;
            document.title = sub.title + ' - TarabBladi';
            document.getElementById('artist-name').textContent = artistName;
            document.getElementById('meta-genre').innerHTML = `<strong>${sub.genre}</strong>`;
            document.getElementById('meta-date').textContent = 'Released: ' + dateStr;
            document.getElementById('info-genre').textContent = sub.genre;
            document.getElementById('info-date').textContent = dateStr;

            // Cover art
            if (sub.cover_url) {
                document.getElementById('cover-art').innerHTML = `<img src="${sub.cover_url}" alt="Cover">`;
            }

            // Download buttons
            document.getElementById('download-btn').href = sub.normal_track_url;
            if (sub.extended_track_url) {
                const eb = document.getElementById('extended-btn');
                eb.href = sub.extended_track_url;
                eb.style.display = 'flex';
            }

            // Artist card
            document.getElementById('artist-card-name').textContent = artistName;
            document.getElementById('artist-card-name').textContent = artistName;
            const bio = sub.profiles?.bio || 'TarabBladi artist. Check out their latest tracks on the platform.';
            document.getElementById('artist-bio').textContent = bio;

            const initials = artistName.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
            const avatarEl = document.getElementById('artist-avatar');
            if (sub.profiles?.avatar_url) {
                avatarEl.innerHTML = `<img src="${sub.profiles.avatar_url}" alt="${artistName}">`;
            } else {
                avatarEl.textContent = initials;
            }

            // Audio
            const audio = document.getElementById('main-audio');
            audio.src = sub.normal_track_url;
            audio.addEventListener('loadedmetadata', () => {
                updateTimeDisplay();
                drawWaveform();
            });
            audio.addEventListener('timeupdate', onTimeUpdate);
            audio.addEventListener('ended', onEnded);

            // Like state
            if (currentUser) {
                const { data: like } = await supabase.from('track_likes').select('id').eq('user_id', currentUser.id).eq('track_id', trackId).single();
                if (like) setLiked(true);
            }
        }

        // ---- Player ----
        window.togglePlay = function() {
            const audio = document.getElementById('main-audio');
            if (audio.paused) { audio.play(); setPlayIcon(false); }
            else { audio.pause(); setPlayIcon(true); }
        };

        function setPlayIcon(showPlay) {
            document.getElementById('play-icon').innerHTML = showPlay
                ? '<path d="M8 5v14l11-7z"/>'
                : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        }

        function onTimeUpdate() {
            const audio = document.getElementById('main-audio');
            const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
            document.getElementById('waveform-progress').style.width = pct + '%';
            document.getElementById('waveform-cursor').style.left = pct + '%';
            updateTimeDisplay();
        }

        function onEnded() { setPlayIcon(true); }

        function updateTimeDisplay() {
            const audio = document.getElementById('main-audio');
            document.getElementById('time-display').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration || 0);
        }

        function fmt(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return m + ':' + String(sec).padStart(2, '0');
        }

        window.setVolume = function(v) {
            document.getElementById('main-audio').volume = v;
        };

        // Waveform click to seek
        document.getElementById('waveform-wrapper').addEventListener('click', function(e) {
            const audio = document.getElementById('main-audio');
            if (!audio.duration) return;
            const rect = this.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        });

        // Draw animated waveform bars
        function drawWaveform() {
            const canvas = document.getElementById('waveform-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const W = canvas.width, H = canvas.height;
            const bars = Math.floor(W / 4);
            ctx.clearRect(0, 0, W, H);
            for (let i = 0; i < bars; i++) {
                const h = (Math.random() * 0.65 + 0.1) * H;
                const x = i * 4;
                ctx.fillStyle = 'rgba(226,183,100,0.35)';
                ctx.fillRect(x, (H - h) / 2, 2.5, h);
            }
        }

        // ---- Like ----
        let liked = false;
        function setLiked(state) {
            liked = state;
            const btn = document.getElementById('like-btn');
            btn.classList.toggle('liked', state);
            btn.innerHTML = state
                ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="#e74c3c" stroke="#e74c3c" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg> Liked`
                : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg> Like`;
        }

        window.handleLike = async function() {
            if (!currentUser) { window.location.href = 'login.html'; return; }
            if (liked) {
                await supabase.from('track_likes').delete().eq('user_id', currentUser.id).eq('track_id', trackId);
                setLiked(false);
            } else {
                await supabase.from('track_likes').insert({ user_id: currentUser.id, track_id: trackId });
                setLiked(true);
            }
        };

        drawWaveform();
    </script>
</body>
</html>
