<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TarabBladi - Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Force overlay to take full screen with no scroll */
        body.admin-login-page {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-main);
        }
        .admin-login-overlay {
            display: flex !important;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,1) 100%);
        }
    </style>
</head>
<body class="admin-login-page">
    <!-- Password Overlay -->
    <div id="admin-login-overlay" class="admin-login-overlay">
        <div class="admin-login-modal">
            <h2>Admin Access</h2>
            <p>Please enter the admin password.</p>
            <input type="password" id="admin-password" placeholder="Password" onkeypress="handlePasswordKeypress(event)">
            <button onclick="checkAdminPassword()">LOGIN</button>
            <p id="admin-error-msg" class="admin-error-msg" style="display:none; color:#e74c3c; margin-top:10px;">Incorrect password.</p>
        </div>
    </div>
    
    <script>
        // Password Protection
        function checkAdminPassword() {
            const pwd = document.getElementById('admin-password').value;
            // Password updated to the secure one
            if (pwd === 'john99mn') {
                sessionStorage.setItem('tarab_admin_auth', 'true');
                window.location.href = 'dashboard-panel-secure.html';
            } else {
                document.getElementById('admin-error-msg').style.display = 'block';
            }
        }

        function handlePasswordKeypress(event) {
            if (event.key === 'Enter') {
                checkAdminPassword();
            }
        }
    </script>
</body>
</html>
